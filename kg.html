        function buildCoverGrid(currentCover) {
            const grid = document.getElementById('coverGrid');
            const uploadedImages = getUploadedImages(); // 你的原函数，返回 [{id, url}]

            // 合并预设封面 + 已上传封面（标记上传类型，用于右键权限）
            const allCovers = [
                ...PRESET_COVERS, // 预设封面：不可删除
                ...uploadedImages.map(img => ({ 
                    ...img, 
                    name: '已上传',
                    isUploaded: true // 标记：用户上传的，允许删除
                }))
            ];

            grid.innerHTML = allCovers.map((c) => `
                <div class="cover-item ${c.url === currentCover ? 'selected' : ''}" 
                    data-url="${c.url}"
                    ${c.isUploaded ? `oncontextmenu="deleteUploadedCover(event, '${c.id}', '${c.url.replace(/'/g, "\\'")}')"` : ''}
                    onclick="selectCover(this, '${c.url.replace(/'/g, "\\'")}')">
                    <img src="${c.url}" alt="${c.name}" loading="lazy">
                    <div class="cover-check">✓</div>
                </div>
            `).join('');

            editSelectedCover = currentCover || '';
        }

        /**
         * 右键删除已上传封面（完全适配 kg_image_store 结构）
         * @param {Event} e 右键事件
         * @param {string} id 图片存储的唯一id
         * @param {string} url 图片地址
         */
        function deleteUploadedCover(e, id, url) {
            e.preventDefault(); // 阻止浏览器默认右键菜单

            // 二次确认
            if (!confirm('⚠️ 确定删除这张上传的封面吗？删除后无法恢复')) {
                return;
            }

            // 1. 从 localStorage 的 kg_image_store 中删除对应 id
            try {
                const imageStore = JSON.parse(localStorage.getItem('kg_image_store') || '{}');
                delete imageStore[id]; // 按ID删除，精准匹配你的存储结构
                localStorage.setItem('kg_image_store', JSON.stringify(imageStore));
            } catch (e) {
                alert('删除失败，存储结构异常');
                return;
            }

            // 2. 处理当前选中的封面：如果删的是当前选中的，清空选中
            if (editSelectedCover === url) {
                editSelectedCover = '';
            }

            // 3. 处理正在编辑的节点：如果节点正在用这个封面，清空节点的封面
            if (editTargetNode && editTargetNode.cover === url) {
                editTargetNode.cover = '';
            }

            // 4. 刷新封面网格
            buildCoverGrid(editSelectedCover);
        }

        function selectCover(el, url) {
            // Deselect all
            document.querySelectorAll('#coverGrid .cover-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            editSelectedCover = url;
            editUploadedCover = ''; // Reset uploaded cover since user selected a preset
            document.getElementById('coverUploadPreview').style.display = 'none';
        }

        async function handleCoverUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const url = await uploadImageToServer(file);
                editUploadedCover = url;
                editSelectedCover = url;

                // Deselect preset covers
                document.querySelectorAll('#coverGrid .cover-item').forEach(item => item.classList.remove('selected'));

                // Show preview
                document.getElementById('coverUploadPreview').style.display = 'block';
                document.getElementById('coverUploadPreviewImg').src = url;
            } catch (err) {
                alert('图片上传失败: ' + err.message);
            }

            // Reset file input
            event.target.value = '';
        }

        function saveEditNode() {
            if (!editTargetNode) return;

            const idx = kgData.nodes.findIndex(n => n.id === editTargetNode.id);
            if (idx === -1) return;

            // 仅使用选择的封面或上传的封面，优先已上传的图片
            let coverToSet = '';
            if (editUploadedCover) {
                coverToSet = editUploadedCover;
            } else if (editSelectedCover) {
                coverToSet = editSelectedCover;
            }
            kgData.nodes[idx].cover = coverToSet;

            // 节点名称
            const newName = document.getElementById('editNodeName').value.trim();
            kgData.nodes[idx].name = newName;

            // 半径
            let inputRadius = parseInt(document.getElementById('editRadius').value);
            const newRadius = (isNaN(inputRadius) || inputRadius < 10) ? 30 : inputRadius; // 防止输入非法值
            kgData.nodes[idx].r = newRadius;

            // 邻居节点名称批量修改
            document.querySelectorAll('#editNeighborsBlock .edit-neighbor-name').forEach(inp => {
                const oid = inp.getAttribute('data-neighbor-id');
                const nix = kgData.nodes.findIndex(n => String(n.id) === String(oid));
                if (nix !== -1) kgData.nodes[nix].name = inp.value.trim();
            });

            // 标签
            const tagsStr = document.getElementById('editTags').value;
            const tags = tagsStr.split(/[,，]/).map(t => t.trim()).filter(t => t.length > 0);
            kgData.nodes[idx].tags = tags;

            // 注册新标签进 tagsConfig
            tags.forEach(t => {
                if (!tagsConfig[t]) {
                    tagsConfig[t] = { color: kgData.nodes[idx].color, radius: newRadius };
                }
            });

            // 编辑保存：半径以表单为准，颜色与封面保持上文已写入的值，不由 tagsConfig 覆盖节点外观

            kg.setOption({ nodes: kgData.nodes, links: kgData.links });
            persistKgData();

            showNodeDetails(kgData.nodes[idx]);
            closeEditNodeModal();
        }

        function applyTagConfigsToNode(idx) {
            const node = kgData.nodes[idx];
            if (!node.tags || node.tags.length === 0) return;

            // 优先采用最后一个已配置的标签
            for (let i = node.tags.length - 1; i >= 0; i--) {
                const cfg = tagsConfig[node.tags[i]];
                if (cfg) {
                    node.color = cfg.color;
                    node.r = cfg.radius;
                    break;
                }
            }
        }

        // ==================== Apply tag from sidebar click ====================
        function applyTagToSelection(tagName) {
            if (selectedNodes.length === 1) {
                const node = selectedNodes[0];
                const idx = kgData.nodes.findIndex(n => n.id === node.id);
                if (idx !== -1) {
                    if (!kgData.nodes[idx].tags) kgData.nodes[idx].tags = [];
                    if (!kgData.nodes[idx].tags.includes(tagName)) {
                        kgData.nodes[idx].tags.push(tagName);
                    }
                    // 应用标签配置
                    applyTagConfigsToNode(idx);
                    kg.setOption({ nodes: kgData.nodes, links: kgData.links });
                    persistKgData();
                    showNodeDetails(kgData.nodes[idx]);
                }
            }
        }

        function addLinkProperty() {
            const block = document.getElementById('editLinkPropertiesBlock');
            const newProp = '<div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;">' +
                '<input type="text" class="edit-link-prop-key" placeholder="属性名" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:4px;">' +
                '<input type="text" class="edit-link-prop-value" placeholder="属性值" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:4px;">' +
                '<button type="button" onclick="removeLinkProperty(this)" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px;background:#f9f9f9;cursor:pointer;">🗑️</button>' +
                '</div>';
            if (block.innerHTML.includes('暂无属性')) {
                block.innerHTML = newProp;
            } else {
                block.innerHTML += newProp;
            }
        }

        function removeLinkProperty(btn) {
            btn.parentElement.remove();
            const block = document.getElementById('editLinkPropertiesBlock');
            if (block.children.length === 0) {
                block.innerHTML = '<span style="color:#888;font-size:0.88rem;">暂无属性</span>';
            }
        }

        function saveEditLink() {
            if (!editTargetLink) return;

            const linkIdx = kgData.links.findIndex(l => l.id === editTargetLink.id);
            if (linkIdx === -1) return;

            // Update type
            const newType = document.getElementById('editLinkType').value.trim();
            kgData.links[linkIdx].type = newType || 'RELATES_TO';

            // Update properties
            const newProperties = {};
            const keyInputs = document.querySelectorAll('#editLinkPropertiesBlock .edit-link-prop-key');
            const valueInputs = document.querySelectorAll('#editLinkPropertiesBlock .edit-link-prop-value');
            keyInputs.forEach((keyInput, index) => {
                const key = keyInput.value.trim();
                const value = valueInputs[index].value.trim();
                if (key) {
                    newProperties[key] = value;
                }
            });
            kgData.links[linkIdx].properties = newProperties;

            // Update the graph
            kg.setOption({ nodes: kgData.nodes, links: kgData.links });
            persistKgData();

            // Update sidebar if open
            showLinkDetails(kgData.links[linkIdx]);

            closeEditLinkModal();
        }

        function closeEditLinkModal() {
            document.getElementById('editLinkModal').classList.remove('show');
            editTargetLink = null;
        }

        // ==================== Tag Manager ====================
        function openTagManager() {
            if (isReduced) { alert('归约状态下不可管理标签，请先展开图谱'); return; }
            renderTagManager();
            document.getElementById('tagManagerModal').classList.add('show');
        }

        function closeTagManager() {
            document.getElementById('tagManagerModal').classList.remove('show');
        }

        function renderTagManager() {
            const tagList = document.getElementById('tagList');
            const tagConfigArea = document.getElementById('tagConfigArea');

            // Collect all tags from nodes
            const allTags = new Set();
            kgData.nodes.forEach(n => {
                if (n.tags) n.tags.forEach(t => allTags.add(t));
            });
            // Also from tagsConfig
            Object.keys(tagsConfig).forEach(t => allTags.add(t));

            if (allTags.size === 0) {
                tagList.innerHTML = '<span style="color:#999;font-size:0.85rem;">暂无标签</span>';
                tagConfigArea.innerHTML = '';
                return;
            }

            tagList.innerHTML = Array.from(allTags).map(t => {
                const cfg = tagsConfig[t];
                const bgColor = cfg ? cfg.color + '22' : '#e3f2fd';
                const textColor = cfg ? cfg.color : '#1976d2';
                const nodeCount = kgData.nodes.filter(n => n.tags && n.tags.includes(t)).length;
                return `<span class="tag-chip" style="background:${bgColor};color:${textColor};">
                    <span class="tag-dot" style="background:${cfg ? cfg.color : '#1976d2'};"></span>
                    ${t} (${nodeCount})
                    <span class="tag-remove" onclick="removeTag('${t.replace(/'/g, "\\'")}')">×</span>
                </span>`;
            }).join('');

            // Render config panels for each tag
            tagConfigArea.innerHTML = Array.from(allTags).map(t => {
                const cfg = tagsConfig[t] || { color: '#58a6ff', radius: 30 };
                const nodeCount = kgData.nodes.filter(n => n.tags && n.tags.includes(t)).length;
                return `
                <div class="tag-config-panel" style="margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <strong style="color:${cfg.color};">🏷️ ${t}</strong>
                        <span style="font-size:0.8rem;color:#999;">${nodeCount} 个节点</span>
                    </div>
                    <div class="form-group">
                        <label>统一颜色</label>
                        <input type="color" value="${cfg.color}" onchange="updateTagConfig('${t.replace(/'/g, "\\'")}', 'color', this.value)">
                    </div>
                    <div class="form-group">
                        <label>统一半径</label>
                        <div class="range-row">
                            <input type="range" min="10" max="80" value="${cfg.radius}" oninput="this.nextElementSibling.textContent=this.value; updateTagConfig('${t.replace(/'/g, "\\'")}', 'radius', parseInt(this.value))">
                            <span class="range-value">${cfg.radius}</span>
                        </div>
                    </div>
                    <button onclick="applyTagConfigToNodes('${t.replace(/'/g, "\\'")}')" style="width:100%;padding:8px;border:none;border-radius:6px;background:${cfg.color};color:#fff;cursor:pointer;font-size:0.85rem;margin-top:4px;">应用到所有 ${t} 标签节点</button>
                </div>`;
            }).join('');
        }

        function addNewTag() {
            const input = document.getElementById('newTagName');
            const name = input.value.trim();
            if (!name) return;

            if (!tagsConfig[name]) {
                tagsConfig[name] = {
                    color: BAR_COLORS[Object.keys(tagsConfig).length % BAR_COLORS.length],
                    radius: 30
                };
            }

            persistKgData();
            input.value = '';
            renderTagManager();
        }

        function removeTag(tagName) {
            // Remove from tagsConfig
            delete tagsConfig[tagName];

            // Remove from all nodes
            kgData.nodes.forEach(n => {
                if (n.tags) {
                    n.tags = n.tags.filter(t => t !== tagName);
                }
            });

            kg.setOption({ nodes: kgData.nodes, links: kgData.links });
            persistKgData();
            renderTagManager();
        }

        function updateTagConfig(tagName, key, value) {
            if (!tagsConfig[tagName]) {
                tagsConfig[tagName] = { color: '#58a6ff', radius: 30 };
            }
            tagsConfig[tagName][key] = value;
            persistKgData();
        }

        function applyTagConfigToNodes(tagName) {
            const cfg = tagsConfig[tagName];
            if (!cfg) return;

            let count = 0;
            kgData.nodes.forEach(n => {
                if (n.tags && n.tags.includes(tagName)) {
                    n.color = cfg.color;
                    n.r = cfg.radius;
                    count++;
                }
            });

            kg.setOption({ nodes: kgData.nodes, links: kgData.links });
            persistKgData();

            // Refresh sidebar if a tagged node is selected
            if (selectedNodes.length === 1 && selectedNodes[0].tags && selectedNodes[0].tags.includes(tagName)) {
                showNodeDetails(selectedNodes[0]);
            }

            alert(`已将标签 "${tagName}" 的配置应用到 ${count} 个节点`);
        }

        // ==================== Fullscreen：逐级展开演示 ====================
        function clearFullscreenGradualDemo() {
            if (fullscreenGradualTimer) {
                clearInterval(fullscreenGradualTimer);
                fullscreenGradualTimer = null;
            }
        }

        /** 归约态全屏时定时「再展开一步」，展示逐级恢复效果 */
        function maybeStartFullscreenGradualExpand() {
            if (fullscreenGradualTimer) return;
            if (typeof isReduced === 'undefined' || !isReduced) return;
            if (!window.kg || typeof window.kg.expandOneGradualStep !== 'function') return;
            fullscreenGradualTimer = setInterval(function () {
                try {
                    const ok = window.kg.expandOneGradualStep();
                    if (!ok) {
                        clearFullscreenGradualDemo();
                        setTimeout(resetSvgBounds, 120);
                    }
                } catch (e) {
                    console.error(e);
                    clearFullscreenGradualDemo();
                }
            }, FULLSCREEN_GRADUAL_STEP_MS);
        }

        // ==================== Fullscreen ====================
        function toggleFullscreen() {
            const kgEl = document.getElementById('kg');
            const exitBtn = document.getElementById('fullscreenExitBtn');

            if (!isFullscreen) {
                // Enter fullscreen（归约态下在全屏画布上定时逐级展开，不一次性全部展开）
                if (kgEl.requestFullscreen) {
                    kgEl.requestFullscreen();
                } else if (kgEl.webkitRequestFullscreen) {
                    kgEl.webkitRequestFullscreen();
                } else if (kgEl.msRequestFullscreen) {
                    kgEl.msRequestFullscreen();
                } else {
                    // Fallback: CSS fullscreen
                    kgEl.classList.add('is-fullscreen');
                    exitBtn.style.display = 'block';
                    setTimeout(maybeStartFullscreenGradualExpand, 800);
                }
                isFullscreen = true;
            } else {
                // Exit fullscreen
                clearFullscreenGradualDemo();
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else {
                    kgEl.classList.remove('is-fullscreen');
                    exitBtn.style.display = 'none';
                }
                exitReadOnlyMode();
                persistKgData();
                isFullscreen = false;
            }
            // Reset SVG bounds after a brief delay to let layout settle
            setTimeout(resetSvgBounds, 150);
        }

        // Listen for fullscreen change (e.g. user presses Esc)
        document.addEventListener('fullscreenchange', function() {
            const exitBtn = document.getElementById('fullscreenExitBtn');
            const kgEl = document.getElementById('kg');
            if (!document.fullscreenElement) {
                isFullscreen = false;
                exitBtn.style.display = 'none';
                clearFullscreenGradualDemo();
            } else {
                exitBtn.style.display = 'block';
                isFullscreen = true;
                if (kgEl && document.fullscreenElement === kgEl) {
                    setTimeout(maybeStartFullscreenGradualExpand, 350);
                }
            }
            // SVG needs to match the new container size
            setTimeout(resetSvgBounds, 100);
        });

        // Listen for window resize - safe reload with multi-link check
        let _resizeTimer = null;
        window.addEventListener('resize', function() {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(function() {
                safeReload('窗口大小变化');
            }, 200);
        });
    </script>

    <!-- ========== 投稿区域 ========== -->
    <div class="contribution-section" style="margin-top: 40px; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
        <h2 class="card-title" style="display: flex; align-items: center; gap: 10px;">
            📤 知识图谱投稿
            <span style="font-size: 0.7em; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 4px 12px; border-radius: 12px;">贡献您的知识</span>
        </h2>
        <p style="color: #666; margin-bottom: 20px; font-size: 0.95rem;">
            您可以将自己创建的知识图谱导出为 JSON 文件并投稿分享。投稿的图谱将会被管理员审核后展示给所有用户。
        </p>
        
        <div class="contribution-upload-area" style="border: 2px dashed #d0d0d0; border-radius: 12px; padding: 40px; text-align: center; transition: all 0.3s ease; cursor: pointer; background: #fafafa;">
            <input type="file" id="contributionFileInput" accept=".json" style="display: none;" onchange="handleContributionUpload(event)">
            <div style="font-size: 3rem; margin-bottom: 15px;">📁</div>
            <div style="font-size: 1.1rem; color: #333; margin-bottom: 8px;">点击或拖拽 JSON 文件到此处</div>
            <div style="font-size: 0.85rem; color: #999;">支持 .json 格式的知识图谱文件，最大 10MB</div>
        </div>
        
        <div id="contributionPreview" style="display: none; margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <h4 style="color: #333; margin-bottom: 15px;">📄 待上传文件</h4>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-radius: 8px; border: 1px solid #e0e0e0;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 1.5rem;">📊</span>
                    <div>
                        <div id="contributionFileName" style="font-weight: 600; color: #333;">filename.json</div>
                        <div id="contributionFileSize" style="font-size: 0.85rem; color: #999;">0 KB</div>
                    </div>
                </div>
                <button onclick="clearContributionFile()" style="background: #f0f0f0; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;">清除</button>
            </div>
            <div style="margin-top: 15px;">
                <label style="display: block; font-size: 0.9rem; color: #555; margin-bottom: 6px;">投稿说明（可选）</label>
                <textarea id="contributionDescription" placeholder="简要描述您投稿的知识图谱内容..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; resize: vertical; min-height: 80px;"></textarea>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button id="submitContributionBtn" onclick="submitContribution()" style="flex: 1; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;">
                    📤 提交投稿
                </button>
            </div>
        </div>
        
        <div id="contributionStatus" style="display: none; margin-top: 15px; padding: 15px; border-radius: 8px; font-size: 0.95rem;"></div>
    </div>

    <style>
        .contribution-upload-area:hover {
            border-color: #764ba2;
            background: #f5f0ff;
        }
        
        .contribution-upload-area.dragover {
            border-color: #764ba2;
            background: #f0e6ff;
            transform: scale(1.01);
        }
        
        #submitContributionBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .contribution-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        .contribution-toast.success { background: #28a745; }
        .contribution-toast.error { background: #dc3545; }
        .contribution-toast.loading { background: #17a2b8; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>

    <script>
        let contributionFile = null;
        
        // 初始化拖拽上传
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.querySelector('.contribution-upload-area');
            
            uploadArea.addEventListener('click', function() {
                document.getElementById('contributionFileInput').click();
            });
            
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleContributionFile(files[0]);
                }
            });
        });
        
        function handleContributionUpload(event) {
            const file = event.target.files[0];
            if (file) {
                handleContributionFile(file);
            }
        }
        
        function handleContributionFile(file) {
            // 验证文件类型
            if (!file.name.endsWith('.json')) {
                showContributionToast('请选择 JSON 格式的文件', 'error');
                return;
            }
            
            // 验证文件大小
            if (file.size > 10 * 1024 * 1024) {
                showContributionToast('文件大小不能超过 10MB', 'error');
                return;
            }
            
            contributionFile = file;
            
            // 显示预览
            document.getElementById('contributionFileName').textContent = file.name;
            document.getElementById('contributionFileSize').textContent = formatFileSize(file.size);
            document.getElementById('contributionPreview').style.display = 'block';
            document.getElementById('contributionStatus').style.display = 'none';
            
            // 验证 JSON 格式
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    JSON.parse(e.target.result);
                } catch (err) {
                    showContributionToast('文件不是有效的 JSON 格式', 'error');
                    clearContributionFile();
                }
            };
            reader.readAsText(file);
        }
        
        function clearContributionFile() {
            contributionFile = null;
            document.getElementById('contributionFileInput').value = '';
            document.getElementById('contributionPreview').style.display = 'none';
            document.getElementById('contributionStatus').style.display = 'none';
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function showContributionToast(message, type) {
            const existing = document.querySelector('.contribution-toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `contribution-toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            if (type !== 'loading') {
                setTimeout(() => toast.remove(), 3000);
            }
            
            return toast;
        }
        
        async function submitContribution() {
            if (!contributionFile) {
                showContributionToast('请先选择文件', 'error');
                return;
            }
            
            const btn = document.getElementById('submitContributionBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 上传中...';
            
            const toast = showContributionToast('正在上传投稿...', 'loading');
            
            try {
                const formData = new FormData();
                formData.append('file', contributionFile);
                
                // 添加投稿说明
                const description = document.getElementById('contributionDescription').value.trim();
                if (description) {
                    formData.append('description', description);
                }
                
                const response = await fetch('/api/picupload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                toast.remove();
                
                if (result.success) {
                    showContributionToast('🎉 投稿成功！感谢您的贡献', 'success');
                    clearContributionFile();
                    
                    // 显示成功状态
                    const status = document.getElementById('contributionStatus');
                    status.style.display = 'block';
                    status.style.background = '#d4edda';
                    status.style.color = '#155724';
                    status.innerHTML = `✅ 投稿成功！文件已上传为 <strong>${result.filename}</strong>`;
                } else {
                    showContributionToast('上传失败: ' + result.error, 'error');
                }
            } catch (error) {
                toast.remove();
                showContributionToast('网络错误，请稍后重试', 'error');
                console.error('上传失败:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 提交投稿';
            }
        }
    </script>
</body>
